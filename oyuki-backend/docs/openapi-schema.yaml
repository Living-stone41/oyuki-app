components:
  schemas:
    AddToCart:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    AssignRider:
      type: object
      properties:
        rider_id:
          type: integer
      required:
      - rider_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Checkout:
      type: object
      properties:
        delivery_address:
          type: string
      required:
      - delivery_address
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    InitiatePayment:
      type: object
      properties:
        order_id:
          type: integer
        method:
          $ref: '#/components/schemas/MethodEnum'
      required:
      - method
      - order_id
    LGA:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        state:
          type: integer
      required:
      - id
      - name
      - state
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Market:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        lga:
          type: integer
      required:
      - id
      - lga
      - name
    MethodEnum:
      enum:
      - BANK_TRANSFER
      type: string
      description: '* `BANK_TRANSFER` - Bank Transfer'
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        related_entity_type:
          type: string
          readOnly: true
        related_entity_id:
          type: integer
          readOnly: true
          nullable: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_read
      - message
      - notification_type
      - read_at
      - related_entity_id
      - related_entity_type
      - title
    NotificationTypeEnum:
      enum:
      - ORDER
      - PAYMENT
      - GENERAL
      type: string
      description: |-
        * `ORDER` - Order
        * `PAYMENT` - Payment
        * `GENERAL` - General
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        seller:
          type: integer
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        rider:
          type: integer
          nullable: true
        rider_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/Status4bcEnum'
        delivery_address:
          type: string
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        payment_status:
          type: string
          readOnly: true
        reject_reason:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_name
      - delivery_address
      - id
      - items
      - payment_status
      - rider_name
      - seller
      - seller_name
      - status_history
      - subtotal
      - total
    OrderItem:
      type: object
